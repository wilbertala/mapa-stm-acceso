<!doctype html>
<html lang="es-UY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#123956">
  <meta name="description" content="Mapa STM: líneas suburbanas y departamentales">
  <title>Mapa STM — Suburbanas y departamentales</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoamYjzR+JW1nA=" crossorigin="anonymous">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./estilos.css">
  <script src="./config.js" defer></script>
  <script src="https://accounts.google.com/gsi/client" defer></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous" defer></script>
  <script src="./app.mjs" type="module"></script>
</head>
<body>
<header>
  <strong>Mapa STM</strong><span>Suburbanas y departamentales</span>
  <div id="googleLogin" aria-label="Acceso ADMINISTRADOR"></div>
  <button id="logout" type="button" hidden>Cerrar sesión</button>
</header>
<div id="notice" role="status">Iniciá sesión como ADMINISTRADOR o ingresá con un enlace de invitación.</div>
<nav class="barra" aria-label="Controles del mapa">
  <button id="toggle" type="button" aria-controls="filtros" aria-expanded="true">☷ Líneas y filtros</button>
  <button id="center" type="button">◎ Centrar mapa</button>
  <button id="clear" type="button">Quitar recorridos</button>
</nav>
<main>
  <aside id="filtros" aria-label="Filtro de recorridos">
    <label>Buscar línea o destino<input id="buscar" type="search" placeholder="Empresa, línea, destino…" autocomplete="off"></label>
    <label>Empresa<select id="empresa"><option value="">Todas</option></select></label>
    <label>Tipo<select id="tipo"><option value="">Suburbanas y departamentales</option><option value="suburbano_metropolitano">Suburbanas metropolitanas</option><option value="departamental_canelones">Departamentales de Canelones</option><option value="regional_san_jose">Regionales de San José</option></select></label>
    <label>Sentido<select id="sentido"><option value="">Todos</option></select></label>
    <p id="count">Esperando datos autorizados</p>
    <div id="resultados" class="resultados"></div>
  </aside>
  <section class="mapwrap" aria-label="Trazados y paradas">
    <div id="map"></div>
    <div id="leyenda">Seleccioná hasta tres recorridos. Mantené pulsado uno para destacarlo.</div>
    <div id="paradasEstado" aria-live="polite">Sin recorridos seleccionados</div>
  </section>
</main>
<footer id="status">Estado: esperando autorización</footer>
</body>
</html>
